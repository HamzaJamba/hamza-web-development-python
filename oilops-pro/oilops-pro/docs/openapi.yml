components:
  schemas:
    AddPartRequest:
      type: object
      properties:
        item:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - item
      - quantity
    AdjustRequest:
      type: object
      properties:
        movement_type:
          $ref: '#/components/schemas/MovementTypeEnum'
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reference:
          type: string
          maxLength: 60
        notes:
          type: string
          maxLength: 255
      required:
      - movement_type
      - quantity
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        equipment_name:
          type: string
          readOnly: true
        equipment_serial:
          type: string
          readOnly: true
        plant_name:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        metric:
          $ref: '#/components/schemas/MetricEnum'
        severity:
          $ref: '#/components/schemas/AlertSeverityEnum'
        status:
          $ref: '#/components/schemas/AlertStatusEnum'
        value:
          type: number
          format: double
        message:
          type: string
          maxLength: 255
        occurrence_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        equipment:
          type: integer
        threshold:
          type: integer
          nullable: true
        acknowledged_by:
          type: integer
          nullable: true
      required:
      - created_at
      - equipment
      - equipment_name
      - equipment_serial
      - id
      - last_seen_at
      - message
      - metric
      - plant_name
      - severity
      - unit
      - value
    AlertRequest:
      type: object
      properties:
        metric:
          $ref: '#/components/schemas/MetricEnum'
        severity:
          $ref: '#/components/schemas/AlertSeverityEnum'
        status:
          $ref: '#/components/schemas/AlertStatusEnum'
        value:
          type: number
          format: double
        message:
          type: string
          minLength: 1
          maxLength: 255
        occurrence_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
