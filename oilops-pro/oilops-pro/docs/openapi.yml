        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - ENGINEER
          - HR
          - PLANT_MANAGER
          - SAFETY_OFFICER
          - STORE_KEEPER
          - TECHNICIAN
          - VIEWER
        description: |-
          * `ADMIN` - Administrator
          * `PLANT_MANAGER` - Plant manager
          * `ENGINEER` - Engineer
          * `TECHNICIAN` - Technician
          * `SAFETY_OFFICER` - Safety officer
          * `STORE_KEEPER` - Store keeper
          * `HR` - HR officer
          * `VIEWER` - Viewer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
