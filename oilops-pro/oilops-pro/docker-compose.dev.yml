# Developer stack with hot reload:  docker compose -f docker-compose.dev.yml up --build
name: oilops-dev
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: oilops, POSTGRES_USER: oilops, POSTGRES_PASSWORD: oilops }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment: &env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://oilops:oilops@db:5432/oilops
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: [db, redis]
  celery:
    build: ./backend
    command: celery -A config worker -l info
    environment: { <<: *env, RUN_MIGRATIONS: "0" }
    volumes: ["./backend:/app"]
    depends_on: [db, redis]
  beat:
    build: ./backend
    command: celery -A config beat -l info
    environment: { <<: *env, RUN_MIGRATIONS: "0" }
    volumes: ["./backend:/app"]
    depends_on: [db, redis]
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment: { VITE_PROXY_TARGET: "http://backend:8000" }
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
volumes:
  pgdata:
