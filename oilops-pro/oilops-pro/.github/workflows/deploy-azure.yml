name: Deploy to Azure
# Builds images, pushes to Azure Container Registry and deploys three App Service (Linux container) apps:
#   API (gunicorn) | Worker (celery worker + beat) | Web (nginx + SPA)
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure (no stored credentials)
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}            # e.g. oilopsacr
  API_APP: ${{ vars.AZURE_API_APP }}        # e.g. oilops-api
  WORKER_APP: ${{ vars.AZURE_WORKER_APP }}  # e.g. oilops-worker
  WEB_APP: ${{ vars.AZURE_WEB_APP }}        # e.g. oilops-web
  API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }} # e.g. https://oilops-api.azurewebsites.net

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name $ACR_NAME

      - name: Build & push backend image
        run: |
          docker build -t $ACR_NAME.azurecr.io/oilops-backend:${{ github.sha }} -t $ACR_NAME.azurecr.io/oilops-backend:latest backend
          docker push --all-tags $ACR_NAME.azurecr.io/oilops-backend
      - name: Build & push web image
        run: |
          docker build -f nginx/Dockerfile --build-arg VITE_API_URL=$API_PUBLIC_URL/api/v1 \
            -t $ACR_NAME.azurecr.io/oilops-web:${{ github.sha }} -t $ACR_NAME.azurecr.io/oilops-web:latest .
          docker push --all-tags $ACR_NAME.azurecr.io/oilops-web

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP }}
          images: ${{ env.ACR_NAME }}.azurecr.io/oilops-backend:${{ github.sha }}
      - name: Deploy worker (celery worker + beat in one container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WORKER_APP }}
          images: ${{ env.ACR_NAME }}.azurecr.io/oilops-backend:${{ github.sha }}
          startup-command: celery -A config worker -B -l info --concurrency 2
      - name: Deploy web
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP }}
          images: ${{ env.ACR_NAME }}.azurecr.io/oilops-web:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "$API_PUBLIC_URL/api/health/" && exit 0 || sleep 20
          done
          echo "API health check failed" && exit 1
